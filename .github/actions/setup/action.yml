name: Setup project
description: Install pnpm + Node, restore caches, install dependencies, and generate ZenStack/Prisma client. Checkout is the caller's responsibility.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  install:
    description: Run pnpm install (set to "false" to skip)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      # pnpm version is read from `packageManager` in package.json — do NOT
      # set `version:` here, the action errors on multiple sources.
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Restore Nuxt build cache
      uses: actions/cache@v4
      with:
        path: |
          .nuxt
          node_modules/.cache
        key: nuxt-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts') }}
        restore-keys: |
          nuxt-${{ runner.os }}-${{ inputs.node-version }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        HUSKY: "0"

    - name: Generate ZenStack / Prisma client
      if: inputs.install == 'true'
      shell: bash
      run: pnpm exec zenstack generate
