name: Setup project
description: Install Bun, restore caches, install dependencies, and generate the ZenStack client. Checkout is the caller's responsibility.

inputs:
  bun-version:
    description: Bun version
    required: false
    default: "latest"
  install:
    description: Run bun install (set to "false" to skip)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Restore Nuxt build cache
      uses: actions/cache@v4
      with:
        path: |
          .nuxt
          node_modules/.cache
        key: nuxt-${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'nuxt.config.ts') }}
        restore-keys: |
          nuxt-${{ runner.os }}-bun-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
      env:
        HUSKY: "0"

    - name: Generate ZenStack client
      if: inputs.install == 'true'
      shell: bash
      run: bunx zenstack generate
