name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "MAP.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".vscode/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "MAP.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  HUSKY: "0"
  NODE_OPTIONS: --max-old-space-size=4096
  NUXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  CI: "true"
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: bunx eslint . --max-warnings=0

  typecheck:
    name: Typecheck (vue-tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare Nuxt (.nuxt/types)
        run: bunx nuxt prepare

      - name: Typecheck
        run: bunx nuxt typecheck

  build:
    name: Build (ZenStack + Nuxt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # NODE_ENV intentionally NOT set at job level — bun install would skip
      # devDependencies (Tailwind plugins, vue-tsc, etc.) and `nuxt prepare`
      # in the postinstall hook would crash. `nuxt build` sets NODE_ENV
      # internally during the build step itself.
      NUXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NUXT_PUBLIC_CONTACT_EMAIL || 'benjamin.tomanik@gmail.com' }}
      NUXT_MAIL_USER: ${{ secrets.NUXT_MAIL_USER || 'ci@example.com' }}
      NUXT_MAIL_PASS: ${{ secrets.NUXT_MAIL_PASS || 'ci-placeholder' }}
      NUXT_CONTACT_MAIL: ${{ secrets.NUXT_CONTACT_MAIL || 'ci@example.com' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://user:pass@localhost:5432/db' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-output-${{ github.sha }}
          # `.output` alone is treated as a single path, not a glob, so the
          # `!`-exclusion below cannot match anything and the action errors
          # with "No files were found". Use an explicit `**` glob to expand
          # the include pattern, then exclude sourcemaps.
          path: |
            .output/**
            !.output/**/*.map
          # Required because `.output` is a dot-prefixed (hidden) directory.
          # upload-artifact@v4 filters those out by default and the glob
          # match yields zero files without this flag.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Summary
        if: always()
        run: |
          echo "### Build summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d .output ]; then
            echo "- **Output size:** $(du -sh .output | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Server bundle:** $(du -sh .output/server 2>/dev/null | cut -f1 || echo 'n/a')" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Public assets:** $(du -sh .output/public 2>/dev/null | cut -f1 || echo 'n/a')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Build failed — no .output directory.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Dependency Review (actions/dependency-review-action) was removed because
  # it requires the GitHub Dependency Graph to be enabled on the repository.
  # Re-add the job once Dependency Graph is turned on in Settings →
  # Code security and analysis.

  audit:
    name: bun audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup (no install)
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Audit production dependencies
        # `|| true` keeps the job green even when advisories surface — they
        # are surfaced in the log and step summary instead of blocking CI.
        # Use the `CI status` gate to enforce hard requirements.
        run: |
          bun audit --prod --audit-level=high | tee audit.txt || true
          {
            echo "### bun audit"
            echo ""
            echo '```'
            tail -n 40 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.typecheck.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more required jobs failed."
            echo "lint=${{ needs.lint.result }}"
            echo "typecheck=${{ needs.typecheck.result }}"
            echo "build=${{ needs.build.result }}"
            exit 1
          fi
          echo "All required jobs passed."
